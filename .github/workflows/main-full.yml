name: "Build Windows EXE (FULL: GPU + 3D SAM)"

# ============================================================
# 完整版 Windows 便携包：GPU 加速（cupy + CUDA 运行时）+ 3D SAM（torch/medim/torchio/monai）
#
# 体积与分包（**必须分包**，GitHub 单资产上限 2 GB）：
#   解压后约 5.2 GB；压缩后拆成两个 **可独立解压** 的 zip：
#     part1of2 = 除 _internal/{torch,cupy*,nvidia} 之外的全部（含 exe、资源、frame/）
#     part2of2 = _internal/{torch,cupy*,nvidia}（CUDA 运行时约 2.8 GB 就在 torch/lib 里）
#   用户把两个包解压到**同一个目录**即合并成完整程序。
#
# 注意（本 workflow 与旧版的关键差异）：
#   1) 用 animal_dicom.spec（ANIMAL_DICOM_FULL=1）—— 里面已固化 license_guard、
#      皮肤/主题/模板、PyCt6 数据文件、cupy 的 softlink 子模块、sympy 等踩过的坑；
#   2) 先跑"释放磁盘"步骤：runner 上 torch 约 5 GB + 构建产物 5.2 GB + 两个 zip 约 2.5 GB；
#   3) 不再用 actions/upload-artifact（账号制品配额已满），统一发到 Release。
# ============================================================

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 释放磁盘（torch + 产物 + 两个 zip 需要 ~15 GB）
        shell: pwsh
        run: |
          foreach ($p in @(
            'C:\Program Files\Android', 'C:\Program Files (x86)\Android',
            'C:\Program Files\dotnet\sdk', 'C:\Program Files\Java',
            'C:\Program Files\Microsoft SDKs', 'C:\Program Files\Google',
            'C:\hostedtoolcache\windows\Ruby', 'C:\hostedtoolcache\windows\Java_11.0.25_x64',
            'C:\hostedtoolcache\windows\Java_17.0.13_x64', 'C:\hostedtoolcache\windows\Java_21.0.5_x64',
            'C:\ProgramData\chocolatey\lib'
          )) {
            if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-PSDrive C | Select-Object @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-List

      - name: Install PyTorch (CUDA 12.4)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cu124

      - name: Install deps (full)
        run: pip install -r requirements-full.txt

      - name: 取 SAM-Med3D 代码（3D SAM 需要；权重首次用时自动下载）
        shell: pwsh
        run: |
          # 代码按 segmentation/config.py 的约定放在 frame/SAM-Med3D-main
          # 官方仓库是 uni-medical/SAM-Med3D（blueyo0 是 HuggingFace 账号，git clone 会要凭据 → 失败）
          git clone --depth 1 https://github.com/uni-medical/SAM-Med3D.git frame/SAM-Med3D-main
          if (-not (Test-Path "frame/SAM-Med3D-main/utils")) { throw "SAM-Med3D 拉取失败" }
          New-Item -ItemType Directory -Force -Path "frame/SAM-Med3D-main/ckpt" | Out-Null

      - name: Build FULL (animal_dicom.spec)
        env:
          ANIMAL_DICOM_FULL: "1"
          KMP_DUPLICATE_LIB_OK: "TRUE"
          OMP_NUM_THREADS: "1"
          PYTHONUTF8: "1"
        # 必须带 --distpath（spec 不带输出目录，默认写 dist/）
        run: pyinstaller --clean --noconfirm --log-level=WARN --distpath dist_animal --workpath build_animal_full animal_dicom.spec

      - name: Package（资源自检 + frame + 两包 zip）
        shell: pwsh
        run: |
          $dist = "dist_animal/Animal_Dicom_Full"
          if (-not (Test-Path $dist)) { throw "构建产物不存在: $dist" }

          Copy-Item packaging/README-FIRST.txt "$dist/README-FIRST.txt" -Force

          # 3D SAM 代码要放在 **exe 同级**（config.py 在冻结模式下按 sys.executable 目录找）
          New-Item -ItemType Directory -Force -Path "$dist/frame" | Out-Null
          robocopy .\frame\SAM-Med3D-main "$dist\frame\SAM-Med3D-main" /E /XD ckpt /NFL /NDL /NJH /NJS /NP | Out-Null
          # robocopy 0-7 都算成功
          if ($LASTEXITCODE -gt 7) { throw "robocopy 失败: $LASTEXITCODE" }

          # 资源 + 依赖自检（缺一个就会拒启/丢功能）
          $need = @(
            "Animal_Dicom.exe",
            "_internal/retro.qss", "_internal/light.qss", "_internal/warm_orange.json",
            "_internal/case_template.json", "_internal/PyCt6/widgets/themes/orange.json",
            "_internal/ErCore.dll",
            "frame/SAM-Med3D-main/utils/click_method.py",
            "_internal/torch/lib/torch_cuda.dll",
            "_internal/cupy_backends/cuda",
            "_internal/segmentation/sam_adapter.py"
          )
          $missing = @()
          foreach ($f in $need) { if (-not (Test-Path (Join-Path $dist $f))) { $missing += $f } }
          if ($missing.Count) { throw ("缺关键文件: " + ($missing -join ", ")) }
          Write-Host "资源/依赖自检通过（$($need.Count) 项）"

          # ---- 清除本机产物（绝不能随包分发：会把本机期限锚点/测试记录带给用户）----
          foreach ($junk in '.trial_anchor.json', 'mcp_records', 'temp', 'deepseek_config.json',
                            'pacs_nodes.json', 'startup_error.log', 'session-dashboard.html') {
            $j = Join-Path $dist $junk
            if (Test-Path $j) { Remove-Item $j -Recurse -Force; Write-Host "清除本机产物: $junk" }
          }

          # ---- 分包（单资产 2 GB 上限；压缩后 ~3 GB 必须拆成 4 包）----
          # part2 = _internal/torch(不含 lib) + cupy*；part3/part4 = _internal/torch/lib 均分两组
          $pkg2 = "pkg_part2/Animal_Dicom/_internal"
          $pkg3 = "pkg_part3/Animal_Dicom/_internal/torch/lib"
          $pkg4 = "pkg_part4/Animal_Dicom/_internal/torch/lib"
          New-Item -ItemType Directory -Force -Path $pkg2, $pkg3, $pkg4 | Out-Null

          if (Test-Path "$dist/_internal/torch") {
            Move-Item "$dist/_internal/torch" "$pkg2/torch" -Force
          }
          foreach ($d in 'cupy', 'cupy_backends', 'cupyx', 'nvidia', 'fastrlock') {
            if (Test-Path "$dist/_internal/$d") {
              Move-Item "$dist/_internal/$d" "$pkg2/$d" -Force
              Write-Host "移入 part2: $d"
            }
          }
          # torch/lib 按体积均分为两组（每组原始体积 <=1.8 GB → 压缩后约 1.0-1.3 GB）
          if (Test-Path "$pkg2/torch/lib") {
            $acc = 0
            Get-ChildItem "$pkg2/torch/lib" -Recurse -File | Sort-Object Length -Descending | ForEach-Object {
              $dst = if ($acc -lt 1.8GB) { $pkg3 } else { $pkg4 }
              Move-Item $_.FullName (Join-Path $dst $_.Name) -Force
              if ($acc -lt 1.8GB) { $acc += $_.Length }
            }
            Remove-Item "$pkg2/torch/lib" -Recurse -Force -ErrorAction SilentlyContinue
          }

          $ver = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } `
                 else { 'ci-' + '${{ github.sha }}'.Substring(0, 7) }
          $z = @{}
          $z[1] = "Animal_Dicom_${ver}_win64_full_part1of4.zip"
          $z[2] = "Animal_Dicom_${ver}_win64_full_part2of4.zip"
          $z[3] = "Animal_Dicom_${ver}_win64_full_part3of4.zip"
          $z[4] = "Animal_Dicom_${ver}_win64_full_part4of4.zip"
          Remove-Item $z[1], $z[2], $z[3], $z[4] -Force -ErrorAction SilentlyContinue

          # 四个包都是"内容级"zip（内部路径 _internal\... 互不重叠）→ 解压到同一目录即合并
          7z a -tzip -mx=5 $z[1] ".\dist_animal\Animal_Dicom_Full\*" | Out-Null
          7z a -tzip -mx=5 $z[2] ".\pkg_part2\Animal_Dicom\*" | Out-Null
          7z a -tzip -mx=5 $z[3] ".\pkg_part3\Animal_Dicom\*" | Out-Null
          7z a -tzip -mx=5 $z[4] ".\pkg_part4\Animal_Dicom\*" | Out-Null

          foreach ($i in 1, 2, 3, 4) {
            if (-not (Test-Path $z[$i])) { throw "zip 失败: $($z[$i])" }
            $mb = (Get-Item $z[$i]).Length / 1MB
            Write-Host ("part{0} = {1:N1} MB" -f $i, $mb)
            if ($mb -gt 1900) { throw ("$($z[$i]) 超过单资产 2GB 上限: {0:N1} MB" -f $mb) }
          }
          "ZIP1=$($z[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP2=$($z[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP3=$($z[3])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP4=$($z[4])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'ci-latest-full' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'CI latest (full - GPU + 3D SAM)' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            ${{ env.ZIP1 }}
            ${{ env.ZIP2 }}
            ${{ env.ZIP3 }}
            ${{ env.ZIP4 }}
          fail_on_unmatched_files: true
