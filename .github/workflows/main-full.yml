name: Build SSD+VR FULL (GPU + 3D SAM) Windows

# 完整版：CUDA 版 PyTorch(TotalSegmentator GPU) + medim/torchio(3D SAM)
# 产物：dist/SSD_VR_Fusion_Viewer/ (onedir) 压缩为 SSD_VR_Fusion_Viewer_Full_Win.zip
# 说明：体积较大(约 2.5-4GB)，故用 onedir+zip 规避 PyInstaller onefile 2GB 限制。

on:
  push:
    branches: [main, master]
    # tag 也要触发，否则那些 if: refs/tags/v 的 Release 步骤永远不会执行
    tags: ['v*']
    paths:
      - "ssd_vr_viewer.py"
      - "segmentation/**"
      - "mcp_ssd_vr/**"
      - "requirements*.txt"
      - "build*.yaml"
      - ".github/workflows/main-full.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (CUDA torch + medim)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cu124
          pip install -r requirements-full.txt
          pip install pyinstaller
          python -c "import torch;print('torch',torch.__version__,'cuda',torch.version.cuda,'avail',torch.cuda.is_available())"
          python -c "import torch,sys; sys.exit(0 if torch.version.cuda else 1)"

      - name: Build FULL EXE (onedir)
        shell: pwsh
        run: |
          $er = "exposure-render-master/exposure-render-master/Source/build/Release/ErCore.dll"
          $args = @(
            "--noconfirm", "--clean", "--onedir", "--noconsole",
            "--name=SSD_VR_Fusion_Viewer", "--icon=logo.ico",
            "--runtime-hook=pyi_rth_vcruntime.py",
            "--add-data=scientific.json;.", "--add-data=dark.qss;.",
            "--add-data=presets.xml;.", "--add-data=logo.ico;.", "--add-data=logo.png;.",
            "--add-data=segmentation;segmentation",
            "--add-data=mcp_ssd_vr;mcp_ssd_vr",
            "--collect-all=PySide6", "--collect-all=PyCt6", "--collect-submodules=PyCt6",
            "--collect-data=PyCt6", "--collect-all=vtkmodules", "--collect-all=SimpleITK",
            "--collect-all=torch", "--collect-all=torchvision",
            "--collect-all=medim", "--collect-all=torchio", "--collect-all=monai",
            "--collect-all=totalsegmentator", "--collect-all=nnunetv2",
            "--collect-all=sklearn", "--collect-all=joblib",
            "--hidden-import=PyCt6", "--hidden-import=PyCt6.widgets.c_button",
            "--hidden-import=PyCt6.widgets.c_label", "--hidden-import=PyCt6.widgets.c_line_edit",
            "--hidden-import=PyCt6.widgets.c_combo_box", "--hidden-import=PyCt6.widgets.c_slider",
            "--hidden-import=PyCt6.widgets.c_frame", "--hidden-import=PyCt6.widgets.c_text_edit",
            "--hidden-import=PyCt6.windows.c_main_window", "--hidden-import=PyCt6.windows.c_toplevel",
            "--hidden-import=PyCt6.appearance.theme_manager", "--hidden-import=PyCt6.appearance.mode_manager",
            "--hidden-import=PySide6.QtSvg", "--hidden-import=PySide6.QtSvgWidgets",
            "--hidden-import=vtkmodules.qt.QVTKRenderWindowInteractor",
            "--hidden-import=scipy.ndimage", "--hidden-import=skimage.restoration",
            "--hidden-import=skimage.filters", "--hidden-import=nibabel",
            "--hidden-import=pacs_client", "--hidden-import=pynetdicom",
            "--hidden-import=pynetdicom.sop_class", "--hidden-import=pydicom",
            "--hidden-import=segmentation.roi_pipeline", "--hidden-import=segmentation.roi_types",
            "--hidden-import=segmentation.roi_label_map",
            "--hidden-import=segmentation.detectors.semantic_detector",
            "--hidden-import=segmentation.sam_pipeline", "--hidden-import=segmentation.sam_adapter",
            "--hidden-import=mcp_ssd_vr.gui_bridge", "--hidden-import=mcp_ssd_vr.bridge_client",
            "--hidden-import=mcp_ssd_vr.bridge_registry",
            "--hidden-import=mcp_ssd_vr.state", "--hidden-import=mcp_ssd_vr.config",
            "--hidden-import=mcp_ssd_vr.recorder",
            "--exclude-module=tkinter"
          )
          if (Test-Path $er) { $args += "--add-binary=$er;." }

          # ============================================================
          # 修复 PyInstallerImportError:
          #   Failed to load dynlib/dll '...\_internal\sklearn\.libs\vcomp140.dll'
          #
          # sklearn 的 _distributor_init.py 会**无条件**执行（没有 os.path.isfile 检查）：
          #     WinDLL(abspath(<sklearn>/.libs/vcomp140.dll))
          #     WinDLL(abspath(<sklearn>/.libs/msvcp140.dll))
          #
          # 而 sklearn 的 .libs 是以点开头的**隐藏目录**，会被分发环节静默丢掉：
          #   * actions/upload-artifact@v4 默认 include-hidden-files: false
          #   * Compress-Archive / Get-ChildItem 递归同样跳过隐藏项
          # 用户拿到的包里就没有 _internal\sklearn\.libs\，绝对路径加载必然失败。
          # （对比：numpy.libs / scipy.libs 不带点，所以它们活了下来。）
          #
          # PyInstaller 的 ctypes 补丁 pyimod03_ctypes._frozen_name() 有一层兜底：
          #   若原路径不存在、且 $MEIPASS\<basename> 存在，就改用后者。
          # 所以把运行库**同时**放进 $MEIPASS 根目录（onedir 下即 _internal\），
          # 就能彻底免疫“隐藏目录被丢弃”，sklearn\.libs 仍保留为首选路径。
          # ============================================================
          $pyBase = (python -c "import sys;print(sys.base_prefix)").Trim()
          $skLibs = ""
          try {
            $skLibs = (python -c "import sklearn,os;print(os.path.join(os.path.dirname(sklearn.__file__),'.libs'))" 2>$null).Trim()
          } catch { $skLibs = "" }

          # (1) 原样保留 sklearn 自带 .libs 布局（delvewheel 首选加载路径）
          if ($skLibs -and (Test-Path -LiteralPath $skLibs)) {
            Write-Host "sklearn .libs: $skLibs"
            Get-ChildItem -LiteralPath $skLibs -Filter *.dll | ForEach-Object {
              Write-Host ("  staged  {0}  ({1} bytes)" -f $_.Name, $_.Length)
              $args += "--add-binary=$($_.FullName);sklearn/.libs"
            }
          } else {
            Write-Warning "sklearn/.libs 不存在，仅依赖 `$MEIPASS basename 兜底"
          }

          # (2) 关键兜底：运行库放进 _internal\（= $MEIPASS 根目录）
          #     来源优先级 sklearn/.libs（与 sklearn 匹配的版本）> Python 目录 > System32
          $searchDirs = @()
          if ($skLibs) { $searchDirs += $skLibs }
          $searchDirs += $pyBase
          $searchDirs += (Join-Path $env:SystemRoot "System32")

          $placed = @()
          foreach ($d in @("vcomp140.dll","msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
            $src = $null
            foreach ($dir in $searchDirs) {
              if (-not $dir) { continue }
              $cand = Join-Path $dir $d
              if (Test-Path -LiteralPath $cand) { $src = $cand; break }
            }
            if ($src) {
              $args += "--add-binary=$src;."
              $placed += [pscustomobject]@{ Dll = $d; Source = $src }
            } else {
              Write-Warning "找不到运行库: $d"
            }
          }
          Write-Host "--- VC/OpenMP DLLs staged into `$MEIPASS (_internal) ---"
          $placed | Format-Table -AutoSize

          foreach ($need in @("vcomp140.dll","msvcp140.dll")) {
            if (@($placed | Where-Object { $_.Dll -eq $need }).Count -eq 0) {
              throw "$need 在 sklearn/.libs、Python 目录、System32 中均未找到，无法避免 sklearn 导入失败。"
            }
          }

          pyinstaller @args ssd_vr_viewer.py

      - name: Fix + verify bundle DLL dependencies
        shell: pwsh
        run: |
          # 修 cc3d 那一类问题：cc3d\fastcc3d*.pyd 依赖 delvewheel 改名的
          # msvcp140-a4c2229bdc2a2a630acdc095b4d86008.dll，而 PyInstaller 按文件名
          # 去重，把它放进了 pandas.libs\（另一个包的目录）→ 运行时报
          #   ImportError: DLL load failed while importing fastcc3d: 找不到指定的模块
          # --flatten 会把这类 mangled DLL 摊到 _internal\ 根目录（loader 必定搜到，
          # 不再依赖导入顺序）；同时对"引用了但整个包都找不到"的情况直接硬失败。
          python tools/check_bundle_dlls.py dist/SSD_VR_Fusion_Viewer --flatten

      - name: Verify bundle (fail fast on missing VC/OpenMP runtime)
        shell: pwsh
        run: |
          $top = "dist/SSD_VR_Fusion_Viewer"
          $internal = "$top/_internal"
          $sklibs = Join-Path $internal "sklearn/.libs"

          # 尽力恢复 sklearn 原生 .libs 布局。注意：这**不是**关键路径，
          # 真正的保障是 _internal\ 根目录里的 vcomp140/msvcp140（$MEIPASS 兜底）。
          New-Item -ItemType Directory -Force -Path $sklibs | Out-Null
          foreach ($d in @("vcomp140.dll","msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
            $src = Join-Path $internal $d
            if (Test-Path -LiteralPath $src) {
              Copy-Item -LiteralPath $src -Destination (Join-Path $sklibs $d) -Force -ErrorAction SilentlyContinue
              if (-not (Test-Path -LiteralPath (Join-Path $top $d))) {
                Copy-Item -LiteralPath $src -Destination (Join-Path $top $d) -Force -ErrorAction SilentlyContinue
              }
            }
          }

          Write-Host "--- _internal root VC/OpenMP dlls (必须含 vcomp140 + msvcp140) ---"
          Get-ChildItem -LiteralPath $internal -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(vcruntime140|msvcp140|vcomp140)' } |
            Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "--- _internal\sklearn\.libs ---"
          Get-ChildItem -LiteralPath $sklibs -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Format-Table -AutoSize

          $missing = @()
          foreach ($d in @("vcomp140.dll","msvcp140.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $internal $d))) { $missing += "_internal/$d" }
          }
          if ($missing.Count -gt 0) {
            throw "缺少关键运行库: $($missing -join ', ') —— sklearn 导入时会再次报 PyInstallerImportError"
          }
          Write-Host "OK: `$MEIPASS 根目录已包含 vcomp140.dll / msvcp140.dll"

      - name: Upload FULL package (onedir 目录)
        # tag 运行时跳过 artifact：Release 资产与 Actions 产物是两套配额，
        # 产物配额一旦打满（曾累积到 190 GB）就会连带掐死后面的 Release 步骤。
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: SSD_VR_Fusion_Viewer_Full_Win
          path: dist/SSD_VR_Fusion_Viewer/
          # 必须为 true：PyInstaller 产物里的 .libs 是点开头的隐藏目录，
          # v4.4.0 起 upload-artifact 默认把它排除，正是本次报错的根因之一。
          include-hidden-files: true
          compression-level: 0
          # 完整版产物约 5.9 GB/次；保留期必须短，否则 Actions 存储配额会被撑爆
          # （2026-09 实际踩过：170 个产物累积到 190 GB，新构建直接上传失败）。
          # 需要长期保存请打 tag：Release 步骤会把 zip 挂到 GitHub Release。
          retention-days: 3

      - name: Release (tag only, zip)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Compress-Archive 会跳过隐藏项（如 sklearn\.libs），
          # 改用 bsdtar：它会把点开头的目录一并打包。
          Push-Location "dist/SSD_VR_Fusion_Viewer"
          tar.exe -a -c -f "../SSD_VR_Fusion_Viewer_Full_Win.zip" .
          Pop-Location
          Get-Item "dist/SSD_VR_Fusion_Viewer_Full_Win.zip" | Select-Object FullName, Length
        continue-on-error: true

      # Release 单文件上限 2 GiB，而 FULL 压完约 2.9 GB（原始 5.75 GB，torch CUDA 占 4.33 GB），
      # 因此必须分卷上传；用户合并方式见 Release 说明（cat / copy /b 后解压）。
      - name: Split FULL zip into <2 GiB parts (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        continue-on-error: true
        run: |
          $zip = "dist/SSD_VR_Fusion_Viewer_Full_Win.zip"
          if (-not (Test-Path $zip)) { Write-Warning "找不到 $zip，跳过分卷"; exit 0 }
          $max = 1900MB
          $size = (Get-Item $zip).Length
          $n = [int][math]::Ceiling($size / $max)
          Write-Host ("zip = {0:N3} GB -> {1} 段（每段上限 1.855 GB）" -f ($size / 1GB), $n)

          $fs = [System.IO.File]::OpenRead((Resolve-Path $zip))
          $buf = New-Object byte[] (8MB)
          try {
            for ($i = 1; $i -le $n; $i++) {
              $part = "$zip.part${i}of${n}"
              $out = [System.IO.File]::Create((Join-Path (Get-Location) $part))
              try {
                $written = 0L
                while ($written -lt $max) {
                  $toRead = [int][math]::Min($buf.Length, $max - $written)
                  $read = $fs.Read($buf, 0, $toRead)
                  if ($read -le 0) { break }
                  $out.Write($buf, 0, $read)
                  $written += $read
                }
              } finally { $out.Close() }
              Write-Host ("  {0}  {1:N3} GB" -f (Split-Path $part -Leaf), ((Get-Item $part).Length / 1GB))
            }
          } finally { $fs.Close() }

          # 校验清单：完整 zip + 各分卷
          $sums = @()
          Get-FileHash $zip -Algorithm SHA256 | ForEach-Object {
            $sums += "$($_.Hash.ToLower())  SSD_VR_Fusion_Viewer_Full_Win.zip"
          }
          Get-ChildItem "$zip.part*" | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $sums += "$h  $($_.Name)"
          }
          $sums | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii
          $sums | ForEach-Object { Write-Host $_ }

      - name: "Upload release assets (tag only: split parts + checksums)"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          # 注意：**不要**把整个 zip 放进来（>2 GiB 会被拒绝）；只传分卷 + 校验清单
          files: |
            dist/SSD_VR_Fusion_Viewer_Full_Win.zip.part*
            dist/SHA256SUMS.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
