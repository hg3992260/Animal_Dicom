name: Build Windows EXE (base)

# ============================================================
# 基础版 Windows 便携包（无 GPU / 无 3D SAM，约 424 MB zip）
#
# 为什么改成用 animal_dicom.spec：
#   之前的内联 pyinstaller 参数漏了 license_guard（→ 冻结版启动即"完整性检查失败"）、
#   皮肤/主题/病例模板数据文件（→ 丢皮肤）、PyCt6 数据文件（→ 启动即崩）。
#   spec 里这些都固化了，并由下面的"资源自检"步骤兜底。
#
# 为什么不再用 actions/upload-artifact：
#   账号的 Actions 制品存储配额已满（Artifact storage quota has been hit），
#   制品会直接上传失败；Release 资产是另一套配额，所以统一走 Release。
#
# 触发方式：
#   · 打 tag（v*）→ 传到该 tag 的 Release（正式版）
#   · 手动 Run workflow → 传到滚动 tag `ci-latest`（预发布，便于随时取最新构建）
# ============================================================

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write          # 创建/更新 Release 需要

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (base)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build (animal_dicom.spec)
        env:
          # torch/libiomp5 与 VTK/SimpleITK 的 OpenMP 重复初始化会让子进程崩溃
          KMP_DUPLICATE_LIB_OK: "TRUE"
          OMP_NUM_THREADS: "1"
          PYTHONUTF8: "1"
        run: pyinstaller --clean --noconfirm --log-level=WARN animal_dicom.spec

      - name: Package + 资源自检 + zip
        shell: pwsh
        run: |
          $dist = "dist_animal/Animal_Dicom"
          if (-not (Test-Path $dist)) { throw "构建产物不存在: $dist" }

          Copy-Item packaging/README-FIRST.txt "$dist/README-FIRST.txt" -Force

          # 资源自检：少任何一个都会导致"拒启/丢皮肤/启动即崩"
          $need = @(
            "Animal_Dicom.exe",
            "_internal/retro.qss", "_internal/light.qss", "_internal/dark.qss",
            "_internal/warm_orange.json", "_internal/case_template.json",
            "_internal/presets.xml", "_internal/render_templates.json",
            "_internal/logo.ico",
            "_internal/PyCt6/widgets/themes/orange.json",
            "_internal/PySide6/plugins/platforms/qwindows.dll",
            "_internal/ErCore.dll"
          )
          $missing = @()
          foreach ($f in $need) {
            if (-not (Test-Path (Join-Path $dist $f))) { $missing += $f }
          }
          if ($missing.Count) { throw ("缺关键文件: " + ($missing -join ", ")) }
          Write-Host "资源自检通过（$($need.Count) 项）"

          # license_guard 会被 main() import；缺了会直接拒启（退出码 4）
          if (-not (Test-Path "license_guard.py")) { throw "license_guard.py 丢失" }
          python -c "import ast,pathlib; ast.parse(pathlib.Path('license_guard.py').read_text(encoding='utf-8')); print('license_guard.py OK')"

          $ver = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } `
                 else { 'ci-' + '${{ github.sha }}'.Substring(0, 7) }
          $zip = "Animal_Dicom_${ver}_win64_portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          7z a -tzip -mx=5 $zip ".\dist_animal\Animal_Dicom" | Out-Null
          if (-not (Test-Path $zip)) { throw "zip 失败" }
          $mb = (Get-Item $zip).Length / 1MB
          Write-Host ("zip = {0:N1} MB" -f $mb)
          if ($mb -gt 1900) { throw ("zip 超过 GitHub 单资产 2GB 上限: {0:N1} MB" -f $mb) }
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'ci-latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'CI latest (base)' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: ${{ env.ZIP }}
          fail_on_unmatched_files: true
